<div class="admin admin-add-loc">

    <form [formGroup]="locationForm" (ngSubmit)="onSubmit()" class="admin-form">
        
        <div class="form-group">
            <label>Номер</label>
            <input type="text" formControlName="locationNumber" placeholder="Введіть номер..." required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Тип Локації</label>
                <select formControlName="type" required>
                    <option value="al8">Альтанка на 8 </option>
                    <option value="al12">Альтанка на 12 </option>
                    <option value="fish_spot">Рибалка</option>
                </select>
            </div>
            <div class="form-group">
                <label>Місткість (чол)</label>
                <input type="number" formControlName="capacity" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Ціна за день (грн)</label>
                <input type="number" formControlName="pricePerDay" placeholder="600" required>
            </div>
            <div class="form-group">
                <label>URL зображення</label>
                <input type="text" formControlName="imageUrl" placeholder="https://...">
            </div>
        </div>

        <div class="form-group">
            <label>Примітка (опис)</label>
            <textarea formControlName="note" rows="3" placeholder="Опишіть локацію..."></textarea>
        </div>

        <button type="submit" id="save-location-btn" [disabled]="locationForm.invalid">Зберегти локацію</button>
    </form>
</div>
